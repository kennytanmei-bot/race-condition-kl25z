# Configuracao do kernel Zephyr para o monitor de acesso

# Console serial (UART0 da FRDM-KL25Z, exposta pela USB do OpenSDA)
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y

# printk() usado para imprimir os resultados
CONFIG_PRINTK=y

# Margem extra de pilha para a thread principal (usa printk)
CONFIG_MAIN_STACK_SIZE=1536

# Permite dar nome as threads (k_thread_name_set), util para depuracao
CONFIG_THREAD_NAME=y
